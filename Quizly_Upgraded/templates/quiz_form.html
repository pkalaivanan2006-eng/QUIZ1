{% extends "base.html" %}{% block title %}{{ 'Edit quiz' if quiz else 'Create quiz' }}{% endblock %}{% block content %}<div class="narrow"><a href="{{ url_for('admin_dashboard') }}" class="back-link">← Back to admin</a><form class="form-card form-wide" method="post"><span class="eyebrow">QUIZ MANAGEMENT</span><h2>{{ 'Edit quiz' if quiz else 'Create a new quiz' }}</h2><label>Quiz title<input name="title" required maxlength="120" value="{{ quiz.title if quiz else '' }}" placeholder="e.g. Web Technology Basics"></label><label>Description<textarea name="description" rows="4" placeholder="Briefly describe this quiz">{{ quiz.description if quiz else '' }}</textarea></label><label>Time limit (minutes)<input type="number" name="timer_minutes" min="1" max="180" value="{{ quiz.timer_minutes if quiz else 10 }}" required><small class="muted">Between 1 and 180 minutes. The timer starts when a participant opens the quiz.</small></label><button class="btn" type="submit">Save quiz →</button></form></div>{% endblock %}
